<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กว่าง (KWANG) — เร็วๆ นี้</title>
<meta name="description" content="กว่าง (KWANG): Global Beetle Community &amp; Marketplace โดย ZOOTRONIA — เปิดให้ใช้งานเร็วๆ นี้">
<meta name="theme-color" content="#10160f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root{
    --bg:#0c110b; --ink:#10160f; --gold:#ffc61a; --green:#17a75a;
    --text:#f2f4ea; --muted:rgba(242,244,234,.62);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"Kanit",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(1100px 480px at 85% -10%, rgba(255,198,26,.14), transparent 60%),
      radial-gradient(900px 400px at 10% 110%, rgba(23,167,90,.12), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    text-align:center;
  }
  .mark{
    width:64px;height:64px;border-radius:18px;margin:0 auto 20px;
    background:var(--gold);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:30px;
  }
  .word{font-size:clamp(28px,6vw,40px);font-weight:600;letter-spacing:.01em;margin:0}
  .word .rom{font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:.08em;margin-left:10px}
  .tag{
    display:inline-block;margin:18px 0 0;padding:7px 16px;border-radius:100px;
    font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--gold);
    background:rgba(255,198,26,.12);border:1px solid rgba(255,198,26,.32);
  }
  p.lead{font-size:16px;color:var(--muted);max-width:420px;margin:22px auto 0;line-height:1.7}
  .back{
    display:inline-flex;align-items:center;gap:7px;margin-top:32px;
    color:var(--text);text-decoration:none;font-size:14.5px;font-weight:500;
    border:1px solid rgba(242,244,234,.22);padding:10px 20px;border-radius:11px;
  }
  .back:hover{border-color:var(--gold);color:var(--gold)}
  .fine{font-size:12.5px;color:rgba(242,244,234,.4);margin-top:28px;font-style:italic}
</style>
</head>
<body>
  <div>
    <div class="mark"><i class="ph-fill ph-bug"></i></div>
    <h1 class="word">กว่าง<span class="rom">KWANG</span></h1>
    <span class="tag">เร็วๆ นี้ · Coming Soon</span>
    <p class="lead">กำลังเตรียมเปิดให้ใช้งาน Global Beetle Community &amp; Marketplace โดย ZOOTRONIA รอติดตามได้เร็วๆ นี้ครับ</p>
    <a class="back" href="./"><i class="ph ph-arrow-left"></i>กลับหน้าแรก</a>
    <p class="fine">Born from Thailand. Built for Beetle Keepers Worldwide.</p>
  </div>
</body>
</html>
