<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community — LIANGDUANG</title>
<meta name="description" content="ชุมชนคนเลี้ยงด้วง LIANGDUANG — ดูโพสต์ของเพื่อนๆ ได้ทุกคน โพสต์/ไลค์/คอมเมนต์ต้องเข้าสู่ระบบก่อน">
<meta name="theme-color" content="#f6f8f3">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f6f8f3; --surface:#ffffff; --surface-2:#f2f7ec; --border:rgba(18,48,28,.16);
  --text:#10160f; --text-2:#23302a; --text-3:#62736a;
  --leaf:#17a75a; --leaf-deep:#0e5c33; --on-leaf:#ffffff;
  --gold:#ffc61a; --ink:#10160f;
  --copper:oklch(76% 0.15 58);
  --display:'Kanit',system-ui,sans-serif; --body:'Kanit',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--text);line-height:1.6;background:var(--bg)}
a{color:var(--leaf-deep);text-decoration:none}
::selection{background:var(--leaf-deep);color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.topnav{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.topnav .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-family:var(--display)}
.topnav .brand img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.topnav .brand small{display:block;font-size:11px;color:var(--text-3);font-weight:500;letter-spacing:.03em}
.topnav .auth-slot{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;padding:10px 20px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:filter 160ms ease,background 160ms ease}
.btn.primary{color:var(--on-leaf);background:var(--leaf-deep)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{color:var(--text);border-color:var(--border);background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:default}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-2)}
.user-chip i{font-size:18px;color:var(--leaf-deep)}

main{padding:24px 0 64px}
.world-title{font-family:var(--display);font-size:22px;margin:20px 0 0}
.tabs{display:flex;gap:4px;padding-top:14px;overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13.5px;font-weight:600;color:var(--text-3);
  background:none;border:none;white-space:nowrap;padding:10px 4px;margin-right:20px;cursor:pointer;border-bottom:2px solid transparent}
.tab i{font-size:16px}
.tab.active{color:var(--leaf-deep);border-bottom-color:var(--leaf-deep)}
.coming-soon{text-align:center;padding:64px 20px;color:var(--text-3)}
.coming-soon i{font-size:34px;color:var(--leaf-deep);margin-bottom:10px;display:block}
.coming-soon h2{font-family:var(--display);color:var(--text);margin:0 0 6px;font-size:18px}
.coming-soon p{margin:0;font-size:14px}

.stats-form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:20px}
.stats-form .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media(max-width:560px){.stats-form .grid{grid-template-columns:1fr}}
.stats-form label{font-size:12.5px;font-weight:600;color:var(--text-2);display:block;margin-bottom:4px}
.stats-form input,.stats-form textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;outline:none}
.stats-form input:focus,.stats-form textarea:focus{border-color:var(--leaf)}
.stats-form .field{margin-bottom:10px}
.stats-form .more-toggle{background:none;border:none;color:var(--leaf-deep);font-weight:600;font-size:13.5px;cursor:pointer;padding:6px 0;margin-bottom:6px}
.stats-form .more-fields{display:none}
.stats-form .more-fields.open{display:grid}
.stats-form .submit-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex}

.stats-search{width:100%;border:1px solid var(--border);border-radius:100px;padding:10px 16px;font:inherit;font-size:14px;outline:none;margin-bottom:16px}
.stats-search:focus{border-color:var(--leaf)}

.species-group{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.species-group h3{font-family:var(--display);font-size:16.5px;margin:0}
.species-group .th-name{font-size:12.5px;color:var(--text-3);font-weight:500;margin:0 0 12px}

.trophy-band{border-radius:13px;background:linear-gradient(135deg,#1a2415,#10160f);
  padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.trophy-band i{font-size:22px;color:var(--gold);flex-shrink:0}
.trophy-band .tt{font-size:13.5px;color:#ffffff;font-weight:600}
.trophy-band .tu{font-size:11.5px;color:rgba(255,255,255,.6)}

.rank-table{width:100%;border-collapse:collapse;font-size:13.5px}
.rank-table th{text-align:left;color:var(--text-3);font-size:11px;letter-spacing:.04em;font-weight:600;
  padding:6px 8px;border-bottom:1px solid var(--border)}
.rank-table td{padding:8px;border-bottom:1px dashed var(--border);color:var(--text-2)}
.rank-table tr:last-child td{border-bottom:none}
.rank-table .num{font-variant-numeric:tabular-nums;text-align:right;color:var(--leaf-deep);font-weight:600}
.rank-pos{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;
  font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-3)}
.rank-pos.gold{background:var(--gold);color:var(--ink);box-shadow:0 0 0 3px rgba(255,198,26,.25)}
.rank-pos.silver{background:#e4e9e0;color:var(--text-2)}
.rank-pos.bronze{background:#f0ddc0;color:#6d4f00}
.composer{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:20px}
.composer textarea{width:100%;border:none;resize:none;font:inherit;color:var(--text);outline:none;min-height:44px}
.composer .row{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid var(--border)}
.composer .preview{max-height:160px;border-radius:10px;margin-top:10px;display:none;max-width:100%}
.composer .file-btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-3);cursor:pointer}
.composer .file-btn input{display:none}
.login-prompt{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:20px;text-align:center;color:var(--text-2);font-size:14.5px}
.login-prompt .btn{margin-top:10px}

.post{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:18px;overflow:hidden}
.post-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
.post-head .avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--leaf-deep);font-weight:700}
.post-head .name{font-weight:600;font-size:14.5px}
.post-head .time{font-size:12.5px;color:var(--text-3)}
.post img.post-image{width:100%;display:block;background:var(--surface-2)}
.post .caption{padding:12px 16px 4px;font-size:14.5px;color:var(--text-2);white-space:pre-wrap}
.post .actions{display:flex;gap:18px;padding:10px 16px;border-top:1px solid var(--border);margin-top:8px}
.post .action{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-3);cursor:pointer;background:none;border:none;font-family:inherit}
.post .action i{font-size:18px}
.post .action.liked{color:#d13a4a}
.post .action.liked i{color:#d13a4a}
.comments{padding:0 16px 14px}
.comment{display:flex;gap:8px;font-size:13.5px;padding:6px 0}
.comment b{color:var(--text)}
.comment-form{display:flex;gap:8px;margin-top:8px}
.comment-form input{flex:1;border:1px solid var(--border);border-radius:100px;padding:8px 14px;font:inherit;font-size:13.5px;outline:none}
.comment-form input:focus{border-color:var(--leaf)}
.comment-form button{border:none;background:none;color:var(--leaf-deep);font-weight:600;font-size:13.5px;cursor:pointer}

.empty,.loading{text-align:center;color:var(--text-3);padding:40px 0;font-size:14.5px}

.modal-overlay{position:fixed;inset:0;background:rgba(16,22,15,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:var(--surface);border-radius:18px;padding:24px;max-width:360px;width:100%}
.modal h3{margin:0 0 4px;font-family:var(--display)}
.modal p.sub{margin:0 0 16px;color:var(--text-3);font-size:13.5px}
.modal label{display:block;font-size:13px;color:var(--text-2);margin:12px 0 4px;font-weight:600}
.modal input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit;outline:none}
.modal input:focus{border-color:var(--leaf)}
.modal .err{color:#d13a4a;font-size:13px;margin-top:10px;min-height:1em}
.modal .modal-actions{display:flex;gap:10px;margin-top:18px}
.modal .modal-actions .btn{flex:1;justify-content:center}
.google-btn{width:100%;justify-content:center;margin-top:16px}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--text-3);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.modal .switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text-3)}
.modal .switch button{background:none;border:none;color:var(--leaf-deep);font-weight:600;cursor:pointer;font:inherit}
.modal .close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;color:var(--text-3);cursor:pointer}
.modal{position:relative}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:100px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity 160ms ease,transform 160ms ease;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<nav class="topnav">
  <div class="wrap" style="display:flex;align-items:center;width:100%">
    <a class="brand" href="index.html"><img src="img/beetle.png" alt="">LIANGDUANG<small>Community</small></a>
    <div class="auth-slot" id="auth-slot"></div>
  </div>
</nav>

<div class="wrap">
  <h1 class="world-title">Beetle World</h1>
  <div class="tabs" id="tabs">
    <button type="button" class="tab active" data-tab="ranking"><i class="ph-fill ph-trophy"></i>Ranking</button>
    <button type="button" class="tab" data-tab="feed"><i class="ph-fill ph-image"></i>ฟีด</button>
    <button type="button" class="tab" data-tab="auction"><i class="ph-fill ph-gavel"></i>ตลาดประมูล</button>
    <button type="button" class="tab" data-tab="care"><i class="ph-fill ph-book-open-text"></i>ข้อมูลการเลี้ยง</button>
  </div>
</div>

<main class="wrap" id="pane-ranking">
  <div id="stats-form-slot"></div>
  <input type="search" class="stats-search" id="stats-search" placeholder="ค้นหาสายพันธุ์...">
  <div id="stats-board">
    <div class="loading">กำลังโหลดสถิติ...</div>
  </div>
</main>

<main class="wrap" id="pane-feed" style="display:none">
  <div id="composer-slot"></div>
  <div id="feed">
    <div class="loading">กำลังโหลดโพสต์...</div>
  </div>
</main>

<main class="wrap" id="pane-auction" style="display:none">
  <div class="coming-soon"><i class="ph-fill ph-gavel"></i><h2>ตลาดประมูล</h2><p>กำลังเตรียมพัฒนาอยู่ครับ — เร็วๆ นี้</p></div>
</main>

<main class="wrap" id="pane-care" style="display:none">
  <div class="coming-soon"><i class="ph-fill ph-book-open-text"></i><h2>ข้อมูลการเลี้ยง</h2><p>กำลังเตรียมพัฒนาอยู่ครับ — เร็วๆ นี้</p></div>
</main>

<div id="modal-slot"></div>

<script src="js/supabase-config.js"></script>
<script src="js/community.js"></script>
</body>
</html>
