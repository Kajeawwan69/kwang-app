<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community — LIANGDUANG</title>
<meta name="description" content="ชุมชนคนเลี้ยงด้วง LIANGDUANG — ดูโพสต์ของเพื่อนๆ ได้ทุกคน โพสต์/ไลค์/คอมเมนต์ต้องเข้าสู่ระบบก่อน">
<meta name="theme-color" content="#f6f8f3">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f6f8f3; --surface:#ffffff; --surface-2:#f2f7ec; --border:rgba(18,48,28,.16);
  --text:#10160f; --text-2:#23302a; --text-3:#62736a;
  --leaf:#17a75a; --leaf-600:#14874a; --leaf-deep:#0e5c33; --on-leaf:#ffffff;
  --gold:#ffc61a; --ink:#10160f;
  --copper:oklch(76% 0.15 58); --copper-deep:oklch(37% 0.12 45);
  --display:'Kanit',system-ui,sans-serif; --body:'Kanit',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--text);line-height:1.6;
  background:
    radial-gradient(900px 360px at 8% -10%, rgba(23,167,90,.10), transparent 72%),
    radial-gradient(700px 300px at 100% 10%, color-mix(in oklch, var(--copper) 14%, transparent), transparent 70%),
    radial-gradient(620px 280px at 96% -2%, rgba(255,198,26,.16), transparent 72%),
    var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0}
a{color:var(--leaf-deep);text-decoration:none}
::selection{background:var(--leaf-deep);color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:4px}
.wrap{max-width:800px;margin:0 auto;padding:0 20px}
.topnav{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.topnav .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-family:var(--display)}
.topnav .brand img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.topnav .brand small{display:block;font-size:11px;color:var(--text-3);font-weight:500;letter-spacing:.03em}
.topnav .auth-slot{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;padding:10px 20px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:filter 160ms ease,background 160ms ease}
.btn.primary{color:var(--on-leaf);background:var(--leaf-600)}
.btn.primary:hover{background:var(--leaf-deep)}
.btn.ghost{color:var(--text);border-color:var(--border);background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:#d13a4a;border-color:rgba(209,58,74,.35);background:transparent}
.btn.danger:hover{background:rgba(209,58,74,.08)}
.btn:disabled{opacity:.55;cursor:default}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-2);
  background:none;border:none;cursor:pointer;padding:0;font-family:inherit}
.user-chip:hover{color:var(--text)}
.user-chip i{font-size:18px;color:var(--leaf-deep)}
.user-chip img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.rank-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--copper-deep);
  background:color-mix(in srgb,var(--copper) 12%,transparent);border:1px solid color-mix(in srgb,var(--copper) 30%,transparent);
  padding:5px 10px;border-radius:100px;white-space:nowrap}
.rank-chip i{font-size:14px}

main{padding:24px 0 64px}
.world-shell{max-width:800px;margin:0 auto;padding:0 20px}
.world-title{font-family:var(--display);font-size:22px;margin:20px 0 0;display:flex;align-items:center;gap:10px}
.world-title i{font-size:26px;background:linear-gradient(135deg,var(--copper),var(--leaf-600));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:4px;padding-top:14px;overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13.5px;font-weight:600;color:var(--text-3);
  background:none;border:none;white-space:nowrap;padding:10px 4px;margin-right:20px;cursor:pointer;border-bottom:2px solid transparent}
.tab i{font-size:16px}
.tab.active{color:var(--copper-deep);border-bottom-color:var(--copper)}

@media(max-width:899px){
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;gap:0;overflow-x:visible;
    background:linear-gradient(180deg,#1a2415,#10160f);border-top:1px solid rgba(255,255,255,.08);
    box-shadow:0 -6px 18px rgba(16,22,15,.25);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;flex-direction:column;gap:2px;background:none;border:none;border-radius:10px;
    padding:6px 2px;margin-right:0;border-bottom:none;font-size:11px;line-height:1.15;color:rgba(255,255,255,.55)}
  .tab i{font-size:19px}
  .tab.active{background:none;border-color:transparent;color:var(--gold)}
  .mb-fab{bottom:calc(84px + env(safe-area-inset-bottom))}
}

@media(min-width:900px){
  .wrap{max-width:none;padding:0 28px}
  .world-shell{max-width:none;padding:0;display:grid;grid-template-columns:230px 1fr;gap:0;align-items:start}
  .world-side{position:sticky;top:0;height:100dvh;padding:28px 18px;border-right:1px solid var(--border)}
  .world-content{padding:0 36px}
  #stats-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start}
  .species-group{margin-bottom:0}
  #pane-feed{max-width:640px}
  .tabs{flex-direction:column;gap:2px;overflow:visible;padding-top:18px}
  .tab{margin-right:0;padding:10px 12px;border-bottom:none;border-left:3px solid transparent;border-radius:0 10px 10px 0;justify-content:flex-start}
  .tab.active{background:var(--surface-2);border-left-color:var(--copper)}
}
.coming-soon{text-align:center;padding:64px 20px;color:var(--text-3)}
.coming-soon i{font-size:34px;color:var(--copper-deep);margin-bottom:10px;display:block}
.coming-soon h2{font-family:var(--display);color:var(--text);margin:0 0 6px;font-size:18px}
.coming-soon p{margin:0;font-size:14px}

.stats-form{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:20px;box-shadow:0 1px 2px rgba(16,22,15,.04)}
.stats-form .grid,#mb-form .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media(max-width:560px){.stats-form .grid,#mb-form .grid{grid-template-columns:1fr}}
.stats-form label,#mb-form label{font-size:12.5px;font-weight:600;color:var(--text-2);display:block;margin-bottom:4px}
.stats-form input,.stats-form textarea,.stats-form select,#mb-form input,#mb-form textarea,#mb-form select{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font:inherit;font-size:16px;outline:none;background:var(--surface);color:var(--text)}
.stats-form input:focus,.stats-form textarea:focus,.stats-form select:focus,#mb-form input:focus,#mb-form textarea:focus,#mb-form select:focus{border-color:var(--leaf)}
.stats-form .field,#mb-form .field{margin-bottom:10px}
.stats-form .more-toggle{background:none;border:none;color:var(--leaf-deep);font-weight:600;font-size:13.5px;cursor:pointer;padding:6px 0;margin-bottom:6px}
.stats-form .more-fields{display:none}
.stats-form .more-fields.open{display:grid}
.stats-form .submit-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex}

#stats-form-slot{display:flex;justify-content:flex-end;margin:16px 0 12px}
.stats-filters{display:flex;gap:10px;margin-bottom:16px}
.stats-search{flex:1;width:100%;border:1px solid var(--border);border-radius:100px;padding:10px 16px;font:inherit;font-size:16px;outline:none;margin-bottom:0}
.stats-search:focus{border-color:var(--leaf)}
#stats-category-filter{border:1px solid var(--border);border-radius:100px;padding:10px 16px;font:inherit;font-size:16px;
  background:var(--surface);color:var(--text);outline:none;cursor:pointer;flex-shrink:0}
#stats-category-filter:focus{border-color:var(--leaf)}
@media(max-width:480px){.stats-filters{flex-direction:column}}

.species-group{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,22,15,.04)}
.species-group h3{font-family:var(--display);font-size:16.5px;margin:0}
.species-group .th-name{font-size:12.5px;color:var(--text-3);font-weight:500;margin:0 0 12px}

.trophy-band{border-radius:13px;background:linear-gradient(135deg,#1a2415,#10160f);
  border-left:3px solid var(--copper);box-shadow:0 0 0 1px rgba(0,0,0,.02),0 6px 16px color-mix(in oklch, var(--copper) 18%, transparent);
  padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.trophy-band i{font-size:22px;color:var(--gold);flex-shrink:0}
.trophy-band .tt{font-size:13.5px;color:#ffffff;font-weight:600}
.trophy-band .tu{font-size:11.5px;color:rgba(255,255,255,.6)}

.rank-table{width:100%;border-collapse:collapse;font-size:13.5px}
.rank-table th{text-align:left;color:var(--text-3);font-size:11px;letter-spacing:.04em;font-weight:600;
  padding:6px 8px;border-bottom:1px solid var(--border)}
.rank-table td{padding:8px;border-bottom:1px dashed var(--border);color:var(--text-2)}
.rank-table tr:last-child td{border-bottom:none}
.rank-table .num{font-variant-numeric:tabular-nums;text-align:right;color:var(--leaf-deep);font-weight:600}
.rank-row-main{cursor:pointer;transition:background 120ms ease}
.rank-row-main:hover{background:var(--surface-2)}
.rank-caret{width:20px;text-align:right}
.rank-caret i{font-size:12px;color:var(--text-3);transition:transform 160ms ease}
.rank-row-main.open .rank-caret i{transform:rotate(180deg)}
.rank-row-main.open{background:var(--surface-2)}
.rank-detail td{padding:12px 8px 16px;border-bottom:1px dashed var(--border)}
.rank-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.rank-detail-grid div{display:flex;flex-direction:column;font-size:12.5px}
.rank-detail-grid span{color:var(--text-3);font-size:11px;margin-bottom:2px}
.rank-detail-grid b{color:var(--text-2);font-weight:600}
.rank-detail-empty{margin:0;font-size:12.5px;color:var(--text-3)}
.rank-detail-img{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--leaf-deep)}
.rank-pos{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;
  font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-3)}
.rank-pos.gold{background:var(--gold);color:var(--ink);box-shadow:0 0 0 3px rgba(255,198,26,.25)}
.rank-pos.silver{background:#e4e9e0;color:var(--text-2)}
.rank-pos.bronze{background:color-mix(in oklch, var(--copper) 45%, #fff3c4);color:var(--copper-deep)}
/* ด้วงของฉัน */
.mb-fab{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#1a2415,#10160f);color:var(--gold);border:2px solid var(--surface);
  box-shadow:0 8px 20px rgba(16,22,15,.26);display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;z-index:35;transition:transform 140ms ease,filter 140ms ease}
.mb-fab:hover{filter:brightness(1.15);transform:translateX(-50%) translateY(-2px)}
.mb-fab:active{transform:translateX(-50%) translateY(0)}
.mb-fab.hidden{display:none}

.mb-profile-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin-bottom:20px}
.mb-profile-avatar{width:52px;height:52px;border-radius:50%;background:var(--surface-2);border:2px solid var(--surface);
  box-shadow:0 0 0 1px var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mb-profile-avatar img{width:100%;height:100%;object-fit:cover}
.mb-profile-avatar i{font-size:26px;color:var(--leaf-deep)}
.mb-profile-info{flex:1 1 auto;min-width:0}
.mb-profile-info b{font-size:15px}
.mb-profile-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.mb-lv{font-size:12px;font-weight:700;color:var(--copper-deep)}
.mb-power-bar{height:7px;border-radius:100px;background:var(--surface-2);overflow:hidden;max-width:260px}
.mb-power-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--leaf),var(--gold));transition:width 300ms ease}
.mb-profile-wx{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:11.5px;
  background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:5px 11px;
  box-shadow:0 1px 2px rgba(16,22,15,.04)}
.mb-profile-wx-standalone{margin-bottom:16px}
.mb-wx-place{display:flex;align-items:center;gap:4px;color:var(--text-3);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-wx-place i{color:var(--leaf-deep);flex-shrink:0}
.mb-wx-chip{display:inline-flex;align-items:center;gap:4px;font-weight:700;padding:4px 9px;border-radius:100px;white-space:nowrap}
.mb-wx-chip.ok{background:color-mix(in srgb,var(--leaf) 14%,transparent);color:var(--leaf-deep)}
.mb-wx-chip.warn{background:color-mix(in srgb,var(--copper) 16%,transparent);color:var(--copper-deep)}
.mb-wx-note{color:var(--text-3);font-size:11.5px;margin:0}

.mb-hero{position:relative;display:flex;align-items:center;gap:14px;border-radius:16px;padding:20px;margin-bottom:20px;
  background:linear-gradient(135deg,#1a2415,#10160f);background-size:cover;background-position:center;color:#fff;overflow:hidden}
.mb-hero i{font-size:30px;color:var(--gold);flex-shrink:0}
.mb-hero-n{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1}
.mb-hero-l{font-size:12.5px;color:rgba(255,255,255,.65);margin-top:2px}

.mb-stat-tiles{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;scroll-snap-type:x proximity;
  padding-bottom:2px;-webkit-overflow-scrolling:touch}
.mb-stat-tiles::-webkit-scrollbar{display:none}
.mb-stat-tiles .mb-tile{flex:0 0 auto;width:150px;scroll-snap-align:start}
@media(min-width:560px){.mb-stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);overflow-x:visible}
  .mb-stat-tiles .mb-tile{width:auto}}
.mb-tile{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(16,22,15,.04);
  transition:transform 140ms ease,box-shadow 140ms ease;text-align:left}
button.mb-tile{cursor:pointer;font:inherit;width:100%}
button.mb-tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(16,22,15,.08)}
.mb-tile i{font-size:19px;color:var(--leaf-deep);flex-shrink:0;width:34px;height:34px;border-radius:10px;
  background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.mb-tile.accent-leaf i{color:var(--leaf-deep);background:color-mix(in srgb,var(--leaf) 16%,var(--surface-2))}
.mb-tile.accent-copper i{color:var(--copper-deep);background:color-mix(in srgb,var(--copper) 20%,var(--surface-2))}
.mb-tile.accent-gold i{color:#9a6f00;background:color-mix(in srgb,var(--gold) 25%,var(--surface-2))}
.mb-tile.accent-trophy i{color:#fff;background:linear-gradient(135deg,var(--copper),var(--gold))}
.mb-tile b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}
.mb-tile span{font-size:11px;color:var(--text-3)}
.mb-stat-tiles.small .mb-tile{padding:9px 12px}
.mb-stat-tiles.small .mb-tile i{display:none}
.mb-stat-tiles.small .mb-tile span{display:block;margin-bottom:2px}
.mb-stat-tiles.small .mb-tile b{font-size:15px}

.mb-due{border-radius:14px;padding:16px;margin-bottom:22px;
  background:linear-gradient(var(--gold-wash-1,#fffdf2),var(--gold-wash-2,#fff8e0));
  border:1px dashed color-mix(in srgb,var(--gold) 55%,transparent)}
.mb-due h3{display:flex;align-items:center;gap:8px;font-size:14.5px;margin:0 0 10px;color:var(--chitin,#6d4f00)}
.mb-collapse-btn{margin-left:auto;background:none;border:none;color:inherit;opacity:.6;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:4px}
.mb-collapse-btn i{transition:transform 180ms ease}
.mb-collapse-btn.closed i{transform:rotate(180deg)}
.mb-due-item{display:flex;align-items:center;gap:10px;padding:9px 6px;margin:0 -6px;border-top:1px dashed color-mix(in srgb,var(--gold) 40%,transparent);
  cursor:pointer;font-size:13.5px;border-radius:8px;transition:background 120ms ease}
.mb-due-item:first-of-type{border-top:none}
.mb-due-item:hover{background:rgba(255,198,26,.14)}
.mb-due-item i{font-size:17px;color:#c98f00}
.mb-due-item .who{flex:1;color:var(--text-2)}
.mb-due-item .who small{display:block;color:var(--text-3);font-size:11.5px}
.mb-due-item .over{color:#c98f00;font-weight:600}
.mb-due-item .code{font-weight:700;color:var(--text)}

.mb-list-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mb-list-head h3{font-size:14.5px;margin:0}
.mb-link{background:none;border:none;color:var(--leaf-deep);font-weight:600;font-size:13px;cursor:pointer}
.mb-link:hover{text-decoration:underline}

.mb-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.mb-cards{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.mb-cards{grid-template-columns:repeat(4,1fr)}}
.mb-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 2px rgba(16,22,15,.04);transition:transform 140ms ease,box-shadow 140ms ease,border-color 140ms ease}
.mb-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(16,22,15,.1);border-color:color-mix(in srgb,var(--leaf) 35%,var(--border))}
.mb-card:active{transform:translateY(0)}
.mb-card-photo{position:relative;aspect-ratio:1;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#1c2318,#10160f)}
.mb-card-glow{position:absolute;inset:0;opacity:.22}
.mb-stg-egg .mb-card-glow{background:radial-gradient(circle at 50% 30%,#9fb8a6,transparent 72%)}
.mb-stg-l1 .mb-card-glow{background:radial-gradient(circle at 50% 30%,#e8c84a,transparent 72%)}
.mb-stg-l2 .mb-card-glow{background:radial-gradient(circle at 50% 30%,var(--gold),transparent 72%)}
.mb-stg-l3 .mb-card-glow{background:radial-gradient(circle at 50% 30%,#c98f00,transparent 72%)}
.mb-stg-pupa .mb-card-glow{background:radial-gradient(circle at 50% 30%,#6bbf86,transparent 72%)}
.mb-stg-adult .mb-card-glow{background:radial-gradient(circle at 50% 30%,var(--leaf-600),transparent 72%)}
.mb-card-photo img{position:relative;width:100%;height:100%;object-fit:cover;z-index:1;filter:brightness(.97)}
.mb-card-photo i{position:relative;z-index:1;font-size:30px;color:rgba(255,255,255,.4)}
.mb-card-accent{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:2}
.mb-stg-egg .mb-card-accent{background:#9fb8a6}
.mb-stg-l1 .mb-card-accent{background:#e8c84a}
.mb-stg-l2 .mb-card-accent{background:var(--gold)}
.mb-stg-l3 .mb-card-accent{background:#c98f00}
.mb-stg-pupa .mb-card-accent{background:#6bbf86}
.mb-stg-adult .mb-card-accent{background:var(--leaf-600)}
.mb-card-badge{position:absolute;top:8px;left:8px;z-index:3;font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;box-shadow:0 1px 3px rgba(16,22,15,.2)}
.mb-card-sex{position:absolute;bottom:11px;right:8px;z-index:3;width:20px;height:20px;border-radius:50%;background:rgba(16,22,15,.55);
  color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center}
.mb-card-body{padding:10px 12px}
.mb-card-body b{display:block;font-size:13.5px}
.mb-card-body small{display:block;color:var(--text-3);font-size:11.5px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-thumb{width:44px;height:44px;border-radius:10px;background:var(--surface-2);flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.mb-thumb img{width:100%;height:100%;object-fit:cover}
.mb-thumb i{font-size:20px;color:var(--leaf-deep)}
.mb-thumb.big{width:72px;height:72px;border-radius:16px}
.mb-thumb.big i{font-size:30px}
.mb-meas{font-size:11.5px;color:var(--leaf-deep);font-weight:600;display:block;margin-top:2px}
.mb-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;white-space:nowrap}
.mb-pill-outline{background:none;border:1px solid var(--border);color:var(--text-2);display:inline-flex;align-items:center;gap:5px}
.mb-stg-egg{background:#dde6e0;color:var(--text-2)}
.mb-stg-l1{background:#ffe08a;color:#5c4400}
.mb-stg-l2{background:var(--gold);color:var(--ink)}
.mb-stg-l3{background:#c98f00;color:#fff}
.mb-stg-pupa{background:#8fd9a8;color:#0e5c33}
.mb-stg-adult{background:var(--leaf-600);color:#fff}

.mb-chips{display:flex;flex-wrap:wrap;gap:8px}
.mb-chip{font:inherit;font-size:13px;font-weight:600;color:var(--text-2);background:var(--surface-2);
  border:1px solid var(--border);padding:7px 13px;border-radius:100px;cursor:pointer;
  transition:background 140ms ease,color 140ms ease,border-color 140ms ease,transform 100ms ease}
.mb-chip:hover{border-color:color-mix(in srgb,var(--leaf) 45%,var(--border))}
.mb-chip:active{transform:scale(.96)}
.mb-chip.on{background:var(--leaf-600);border-color:var(--leaf-600);color:#fff}

.mb-back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-3);
  font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:12px;padding:0;transition:color 120ms ease}
.mb-back:hover{color:var(--leaf-deep)}
.mb-detail-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.mb-detail-head h2{font-family:var(--display);font-size:19px;margin:0}
.mb-sub{margin:2px 0 8px;color:var(--text-3);font-size:13px}
.mb-note-line{color:var(--text-3);font-size:12.5px;margin:10px 0}
.mb-note-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.mb-note-card b{display:block;font-size:12.5px;margin-bottom:4px}
.mb-note-card p{margin:0;font-size:13.5px;color:var(--text-2);white-space:pre-wrap}
.mb-qa{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.mb-qa .btn{transition:transform 100ms ease,background 140ms ease,border-color 140ms ease}
.mb-qa .btn:active{transform:translateY(1px)}
.mb-tl-head{font-size:13.5px;color:var(--text-3);margin:18px 0 8px;font-weight:600}
.mb-tl{list-style:none;margin:0;padding:0;position:relative}
.mb-tl li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px dashed var(--border);font-size:13.5px}
.mb-tl li:first-child{border-top:none}
.mb-tl i{font-size:15px;color:var(--leaf-deep);margin-top:2px;flex-shrink:0;width:26px;height:26px;border-radius:50%;
  background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.mb-tl-mid{flex:1}
.mb-tl-mid small{display:block;color:var(--text-3);font-size:12px}
.mb-tl-date{color:var(--text-3);font-size:11.5px;flex-shrink:0;white-space:nowrap}

.mb-photo-pick{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mb-photo-prev{width:56px;height:56px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);
  overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mb-photo-prev img{width:100%;height:100%;object-fit:cover}
.mb-photo-prev i{font-size:22px;color:var(--text-3)}
.mb-form-title{font-family:var(--display);font-size:19px;margin:0 0 14px}
.mb-empty{text-align:center;padding:40px 24px;color:var(--text-3);border:2px dashed var(--border);border-radius:18px;
  background:var(--surface)}
.mb-empty i{font-size:32px;color:var(--leaf-deep);margin-bottom:10px;display:block}
.mb-empty p{margin:0 0 14px;font-size:14px}
.mb-empty a{color:var(--leaf-deep);font-weight:600}
.mb-empty:last-child{margin-bottom:0}

.fc-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--chitin,#6d4f00);margin-bottom:10px}
.fc-head i{color:var(--gold)}
.fc-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.fc-row::-webkit-scrollbar{display:none}
.fc-card{flex:0 0 auto;width:140px;background:var(--surface);border:1px solid color-mix(in srgb,var(--gold) 35%,var(--border));
  border-radius:14px;padding:12px;scroll-snap-align:start;box-shadow:0 1px 2px rgba(16,22,15,.04)}
.fc-sp{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-sp-th{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.fc-val{font-size:16px;font-weight:700;color:var(--leaf-deep);margin-top:8px;font-variant-numeric:tabular-nums}
.fc-by{font-size:11px;color:var(--text-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:20px;box-shadow:0 1px 2px rgba(16,22,15,.04)}
.composer textarea{width:100%;border:none;resize:none;font:inherit;color:var(--text);outline:none;min-height:44px}
.composer .row{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:12px;border-top:1px solid var(--border)}
.composer .preview{max-height:160px;border-radius:10px;margin-top:10px;display:none;max-width:100%}
.composer .file-btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-3);cursor:pointer}
.composer .file-btn input{display:none}
.login-prompt{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:20px;text-align:center;color:var(--text-2);font-size:14.5px}
.login-prompt .btn{margin-top:10px}

.post{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:18px;overflow:hidden;box-shadow:0 1px 2px rgba(16,22,15,.04)}
.post-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
.post-head .avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--leaf-deep);font-weight:700}
.post-head .name{font-weight:600;font-size:14.5px}
.post-head .time{font-size:12.5px;color:var(--text-3)}
.post img.post-image{width:100%;display:block;background:var(--surface-2)}
.post .caption{padding:12px 16px 4px;font-size:14.5px;color:var(--text-2);white-space:pre-wrap}
.post .actions{display:flex;gap:18px;padding:10px 16px;border-top:1px solid var(--border);margin-top:8px}
.post .action{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-3);cursor:pointer;background:none;border:none;font-family:inherit}
.post .action i{font-size:18px}
.post .action.liked{color:#d13a4a}
.post .action.liked i{color:#d13a4a}
.comments{padding:0 16px 14px}
.comment{display:flex;gap:8px;font-size:13.5px;padding:6px 0}
.comment b{color:var(--text)}
.comment-form{display:flex;gap:8px;margin-top:8px}
.comment-form input{flex:1;border:1px solid var(--border);border-radius:100px;padding:8px 14px;font:inherit;font-size:16px;outline:none}
.comment-form input:focus{border-color:var(--leaf)}
.comment-form button{border:none;background:none;color:var(--leaf-deep);font-weight:600;font-size:13.5px;cursor:pointer}

.empty,.loading{text-align:center;color:var(--text-3);padding:40px 0;font-size:14.5px}

.modal-overlay{position:fixed;inset:0;background:rgba(16,22,15,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:var(--surface);border-radius:18px;padding:24px;max-width:360px;width:100%;max-height:85vh;overflow-y:auto}
.modal h3{margin:0 0 4px;font-family:var(--display)}
.modal p.sub{margin:0 0 16px;color:var(--text-3);font-size:13.5px}
.modal label{display:block;font-size:13px;color:var(--text-2);margin:12px 0 4px;font-weight:600}
.modal input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit;outline:none}
.modal input:focus{border-color:var(--leaf)}
.modal .err{color:#d13a4a;font-size:13px;margin-top:10px;min-height:1em}
.modal .modal-actions{display:flex;gap:10px;margin-top:18px}
.modal .modal-actions .btn{flex:1;justify-content:center}
.logout-link{display:flex;align-items:center;gap:8px;justify-content:center;width:100%;margin-top:16px;padding-top:16px;
  border-top:1px solid var(--border);background:none;border-left:none;border-right:none;border-bottom:none;
  color:#d13a4a;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.logout-link + .logout-link{margin-top:10px;padding-top:0;border-top:none}
.admin-summary{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.admin-count{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--border);padding:5px 10px;border-radius:100px}
.admin-count i{font-size:14px;color:var(--leaf-deep)}
.admin-table{display:block;overflow-x:auto;white-space:nowrap}
.role-select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px;
  background:var(--surface);color:var(--text);outline:none;cursor:pointer}
.role-select:disabled{opacity:.5;cursor:not-allowed}
.profile-avatar-row{display:flex;align-items:center;gap:14px;margin:16px 0 20px}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;overflow:hidden;position:relative}
.profile-avatar i.ph-user-circle{font-size:34px;color:var(--leaf-deep)}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar .edit-badge{position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;
  background:var(--leaf-600);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
.google-btn{width:100%;justify-content:center;margin-top:16px}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--text-3);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.modal .switch{text-align:center;margin-top:14px;font-size:13px;color:var(--text-3)}
.modal .switch button{background:none;border:none;color:var(--leaf-deep);font-weight:600;cursor:pointer;font:inherit}
.modal .close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;color:var(--text-3);cursor:pointer}
.modal{position:relative}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:100px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity 160ms ease,transform 160ms ease;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<nav class="topnav">
  <div class="wrap" style="display:flex;align-items:center;width:100%">
    <a class="brand" href="index.html"><img src="img/beetle.png" alt="">LIANGDUANG<small>Community</small></a>
    <div class="auth-slot" id="auth-slot"></div>
  </div>
</nav>

<div class="world-shell">
  <aside class="world-side">
    <h1 class="world-title"><i class="ph-fill ph-globe-hemisphere-west"></i>Beetle World</h1>
    <div class="tabs" id="tabs">
      <button type="button" class="tab active" data-tab="overview"><i class="ph-fill ph-squares-four"></i>ภาพรวม</button>
      <button type="button" class="tab" data-tab="ranking"><i class="ph ph-trophy"></i>Ranking</button>
      <button type="button" class="tab" data-tab="feed"><i class="ph ph-image"></i>ฟีด</button>
      <button type="button" class="tab" data-tab="mybeetles"><i class="ph ph-bug"></i>ด้วงของฉัน</button>
      <button type="button" class="tab" data-tab="auction"><i class="ph ph-gavel"></i>ตลาดประมูล</button>
      <button type="button" class="tab" data-tab="care"><i class="ph ph-book-open-text"></i>ข้อมูลการเลี้ยง</button>
    </div>
  </aside>

  <div class="world-content">
    <main id="pane-overview">
      <div id="overview-root"></div>
    </main>

    <main id="pane-ranking" style="display:none">
      <div id="stats-form-slot"></div>
      <div class="stats-filters">
        <select id="stats-category-filter">
          <option value="">ทุกหมวด</option>
          <option value="ด้วงกว่าง">ด้วงกว่าง</option>
          <option value="คีม">คีม</option>
          <option value="ดอกไม้">ดอกไม้</option>
        </select>
        <input type="search" class="stats-search" id="stats-search" placeholder="ค้นหาสายพันธุ์...">
      </div>
      <div id="stats-board">
        <div class="loading">กำลังโหลดสถิติ...</div>
      </div>
    </main>

    <main id="pane-feed" style="display:none">
      <div id="feed-champions"></div>
      <div id="composer-slot"></div>
      <div id="feed">
        <div class="loading">กำลังโหลดโพสต์...</div>
      </div>
    </main>

    <main id="pane-mybeetles" style="display:none">
      <div id="mybeetles-root"></div>
    </main>

    <main id="pane-auction" style="display:none">
      <div class="coming-soon"><i class="ph-fill ph-gavel"></i><h2>ตลาดประมูล</h2><p>กำลังเตรียมพัฒนาอยู่ครับ — เร็วๆ นี้</p></div>
    </main>

    <main id="pane-care" style="display:none">
      <div class="coming-soon"><i class="ph-fill ph-book-open-text"></i><h2>ข้อมูลการเลี้ยง</h2><p>กำลังเตรียมพัฒนาอยู่ครับ — เร็วๆ นี้</p></div>
    </main>
  </div>
</div>

<button type="button" class="mb-fab hidden" id="mb-fab" title="บันทึกด้วงตัวใหม่"><i class="ph-fill ph-plus"></i></button>

<div id="modal-slot"></div>

<script src="js/supabase-config.js"></script>
<script src="js/community.js"></script>
<script src="js/db.js"></script>
<script src="js/my-beetles.js"></script>
</body>
</html>
